name: Faber paper trade

# Paper trading only. faber-lean/paper/paper_trade.py hardcodes Alpaca's paper
# endpoint and asserts it before sending anything, and live Alpaca keys do not
# authenticate against that endpoint. Nothing in this workflow can place a real
# order, and nothing in it reads or writes stockedge100/.

on:
  schedule:
    # 15:00 UTC on weekdays = 11:00 ET during EDT, 10:00 ET during EST. Both
    # land well inside Alpaca's market-on-close submission window (before 15:50
    # ET), so even a badly delayed scheduled run still gets the backtest's fill
    # bar. GitHub cron is UTC only and does not follow DST, which is exactly why
    # the margin is hours rather than minutes.
    - cron: "0 15 * * 1-5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Compute everything, submit no orders"
        type: boolean
        default: false
      force_rebalance:
        description: "Rebalance even if today is not the first trading day of the month"
        type: boolean
        default: false

permissions:
  contents: write   # commit the run log
  issues: write     # open the notification issue

# Never let two runs diff positions against the broker at the same time.
concurrency:
  group: faber-paper
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: faber-lean/paper/requirements.txt

      - name: Install dependencies
        run: pip install -r faber-lean/paper/requirements.txt

      - name: Guard the port
        # The execution tests need no keys and no price cache. If the signal or
        # sizing logic has drifted, fail here rather than at the broker.
        working-directory: faber-lean/paper
        run: python -m pytest test_execution.py -q

      - name: Run the strategy
        id: run
        continue-on-error: true
        working-directory: faber-lean/paper
        env:
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
        run: |
          python paper_trade.py \
            ${{ inputs.dry_run && '--dry-run' || '' }} \
            ${{ inputs.force_rebalance && '--force-rebalance' || '' }}

      - name: Read the outcome
        id: outcome
        if: always()
        working-directory: faber-lean/paper
        run: |
          if [ ! -f run_result.json ]; then
            echo "action=ERROR"   >> "$GITHUB_OUTPUT"
            echo "notify=true"    >> "$GITHUB_OUTPUT"
            echo "headline=Faber paper run produced no result file" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          r = json.load(open("run_result.json"))
          print("action=" + r["action"])
          print("notify=" + ("true" if r["notify"] else "false"))
          print("headline=" + r["headline"].replace("\n", " "))
          PY

      - name: Commit the log
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Explicit paths, never `git add -A`: this repository also contains the
          # frozen stockedge100/ tree and an unreviewed _scratch/ directory.
          git add faber-lean/paper/paper_log.csv faber-lean/paper/state.json
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "paper: ${{ steps.outcome.outputs.action }} $(date -u +%Y-%m-%d) [skip ci]"
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && \
              git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            echo "push attempt $attempt failed, retrying"
            sleep 5
          done
          exit 1

      - name: Upload the run detail
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: faber-run-${{ github.run_number }}
          path: |
            faber-lean/paper/run_result.json
            faber-lean/paper/paper_log.csv
            faber-lean/paper/state.json
          if-no-files-found: warn
          retention-days: 90

      - name: Notify by GitHub issue
        # Assigning the issue is what produces a real push notification in the
        # GitHub mobile app. Only rebalances, deferrals and errors notify --
        # ordinary "nothing to do today" runs stay silent in the log.
        if: always() && steps.outcome.outputs.notify == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BODY=faber-lean/paper/run_body.md
          python - <<'PY' > "$BODY"
          import json, os
          try:
              with open("faber-lean/paper/run_result.json", encoding="utf-8") as fh:
                  print(json.load(fh)["summary_markdown"])
          except Exception as exc:
              print(f"The run produced no summary ({exc}). See the workflow log.")
          env = os.environ
          run = f"{env['GITHUB_SERVER_URL']}/{env['GITHUB_REPOSITORY']}/actions/runs/{env['GITHUB_RUN_ID']}"
          print("\n---")
          print(f"[workflow run]({run}) - "
                "[Alpaca paper dashboard](https://app.alpaca.markets/paper/dashboard/overview)")
          PY
          # Idempotent; the label already existing is not an error worth failing on.
          gh label create faber-paper --color 1f6feb \
            --description "Faber sector rotation paper-trading runs" || true
          gh issue create \
            --title "${{ steps.outcome.outputs.headline }}" \
            --body-file "$BODY" \
            --assignee "${{ github.repository_owner }}" \
            --label faber-paper

      - name: Fail the job if the run failed
        if: always() && steps.run.outcome == 'failure'
        run: |
          echo "::error::paper_trade.py exited non-zero (action=${{ steps.outcome.outputs.action }})"
          exit 1
